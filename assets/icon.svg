<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5E63FF"/>
      <stop offset="1" stop-color="#3437C9"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6E8FF"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- App tile background with rounded corners (squircle-ish) -->
  <rect x="80" y="80" width="864" height="864" rx="200" ry="200" fill="url(#bg)"/>

  <!-- Clipboard body -->
  <g filter="url(#softShadow)">
    <rect x="260" y="280" width="504" height="600" rx="44" ry="44" fill="url(#board)"/>
    <!-- Clip head -->
    <rect x="396" y="216" width="232" height="120" rx="32" ry="32" fill="#1E2266"/>
    <rect x="430" y="248" width="164" height="58" rx="18" ry="18" fill="#FFFFFF" opacity="0.95"/>
  </g>

  <!-- Lines on the clipboard (representing entries) -->
  <g fill="#3437C9">
    <rect x="320" y="430" width="384" height="36" rx="14"/>
    <rect x="320" y="500" width="320" height="36" rx="14" opacity="0.85"/>
    <rect x="320" y="570" width="360" height="36" rx="14" opacity="0.70"/>
    <rect x="320" y="640" width="260" height="36" rx="14" opacity="0.55"/>
    <rect x="320" y="710" width="304" height="36" rx="14" opacity="0.40"/>
  </g>

  <!-- Star (representing favorites) -->
  <g transform="translate(708 770)">
    <polygon points="0,-70 18,-22 70,-22 28,8 44,60 0,30 -44,60 -28,8 -70,-22 -18,-22"
             fill="#FFD23F" stroke="#B58400" stroke-width="6"/>
  </g>
</svg>
