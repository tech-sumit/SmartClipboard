name: SmartClipboard
options:
  bundleIdPrefix: com.shailka
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "6.29.0"

targets:
  SmartClipboard:
    type: application
    platform: macOS
    sources:
      - path: SmartClipboard
        excludes:
          - "Assets.xcassets"
      - path: bin/clip
        buildPhase: resources
        type: file
      - path: assets/AppIcon.icns
        buildPhase: resources
        type: file
    dependencies:
      - package: GRDB
        product: GRDB
    info:
      path: SmartClipboard/Info.plist
      properties:
        CFBundleName: SmartClipboard
        CFBundleDisplayName: Smart Clipboard
        CFBundleIdentifier: com.shailka.SmartClipboard
        CFBundleShortVersionString: "0.1.1"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "13.0"
        NSHumanReadableCopyright: ""
        CFBundleIconFile: AppIcon
        CFBundleURLTypes:
          - CFBundleURLName: com.shailka.SmartClipboard.url
            CFBundleURLSchemes: [smartclipboard]
    settings:
      base:
        INFOPLIST_FILE: SmartClipboard/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.shailka.SmartClipboard
        CODE_SIGN_ENTITLEMENTS: SmartClipboard/SmartClipboard.entitlements
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: "1"
