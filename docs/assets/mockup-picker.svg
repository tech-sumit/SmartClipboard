        <rect x="0" y="0" width="34" height="14" rx="3" fill="rgba(94,99,255,0.3)"/>
        <text x="17" y="11" font-size="9" font-weight="700" fill="rgba(255,255,255,0.85)" text-anchor="middle">TEXT</text>
        <text x="42" y="11" font-size="11" fill="rgba(255,255,255,0.55)">iTerm  ·  2 min ago  ·  21 B</text>
