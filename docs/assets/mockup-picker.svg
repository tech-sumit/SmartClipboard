      <stop offset="0" stop-color="#0f1228"/>
      <stop offset="1" stop-color="#1d1f3e"/>
    </linearGradient>
    <filter id="windowShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="880" height="600" fill="url(#bg2)"/>
  <circle cx="700" cy="120" r="180" fill="#5E63FF" opacity="0.12"/>
